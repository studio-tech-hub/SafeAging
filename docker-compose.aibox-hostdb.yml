# AI Box overlay — QCS6490 kernel lacks SysV shm; PostgreSQL cannot run in Docker here.
# Analytics uses EDGE_SQLITE_PATH (/app/runtime/edge_state.db) for persons, embeddings,
# zones, events — admin UI and face gallery work without Postgres.
#
#   docker compose -f docker-compose.yml -f docker-compose.aibox-hostdb.yml up -d

services:
  postgres:
    profiles: ["docker-postgres"]

  analytics:
    depends_on: !override
      minio:
        condition: service_started
    environment:
      - DATABASE_URL=
      # ── AI Box stable profile (QCS6490) ─────────────────────────────────────
      # Must stay at 1 worker: camera track state lives in-process (not shared).
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      - MODEL_PATH=${MODEL_PATH:-/app/models/yolo26n.onnx}
      - YOLO_IMGSZ=640
      - ENABLE_FACE_RECOGNITION=${ENABLE_FACE_RECOGNITION:-true}
      # buffalo_l matches default enrollment; do not switch to buffalo_s on edge.
      - FACE_MODEL_PACK=buffalo_l
      - FACE_RECOG_INTERVAL_FRAMES=${FACE_RECOG_INTERVAL_FRAMES:-6}
      - FACE_DET_SIZE=${FACE_DET_SIZE:-640}
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.40}
      - OUTPUT_TENTATIVE_TRACKS=true
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-2}
    volumes:
      # Persist insightface model pack across container recreates (buffalo_l ~280MB).
      - safeaging-insightface:/root/.insightface

volumes:
  safeaging-insightface:
