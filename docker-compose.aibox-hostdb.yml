# AI Box CPU production profile — QCS6490 @ 640px (commercial headroom).
#
#   docker compose -f docker-compose.yml -f docker-compose.aibox-hostdb.yml up -d
#
# Models: yolo26n.onnx only on CPU (do NOT use yolo26s here).
# ORT 1.24.4 pinned in Dockerfile (aarch64 wheel).

services:
  postgres:
    profiles: ["docker-postgres"]

  analytics:
    depends_on: !override
      minio:
        condition: service_started
    ports: !override
      # Nx mediaserver/plugin runs on the same AI Box and calls 127.0.0.1.
      # Do not expose /health, /status, /metrics, or /infer to the LAN.
      - "127.0.0.1:${SERVICE_PORT:-18000}:18000"
    environment:
      - DATABASE_URL=
      # ── Inference (CPU lean, ~4 ORT threads total for headroom) ─────────────
      - UVICORN_WORKERS=1
      - MODEL_PATH=/app/models/yolo26n.onnx
      - YOLO_IMGSZ=640
      - YOLO_BACKEND=cpu_lean
      - YOLO_LEAN_POOL_SIZE=2
      - YOLO_LEAN_THREADS=2
      - ENABLE_INPUT_UPSCALE=true
      - CONFIDENCE_THRESHOLD=0.70
      - IOU_THRESHOLD=0.45
      - PERSON_MIN_HW_RATIO=0.75
      - MIN_DETECTION_AREA=24
      - TRACK_MIN_HITS=2
      - OUTPUT_TENTATIVE_TRACKS=false
      # ── Face (buffalo_s + time scheduler) ───────────────────────────────────
      - ENABLE_FACE_RECOGNITION=true
      - FACE_MODEL_PACK=buffalo_s
      - FACE_DET_SIZE=640
      - FACE_MIN_PIXELS=40
      - FACE_MATCH_THRESHOLD=0.42
      - FACE_RECOG_USE_TIME_SCHEDULER=true
      - FACE_RECOG_UNKNOWN_RETRY_SEC=8
      # ── Fall (bbox always; tier-2 pose crop only when suspected) ──────────
      - ENABLE_FALL_DETECTION=true
      - ENABLE_POSE_FALL=false
      - FALL_CONFIRM_FRAMES=3
      - FALL_VELOCITY_REF_HEIGHT=120
      - FALL_VELOCITY_THRESHOLD=22
      - FALL_ASPECT_RATIO_THRESHOLD=1.6
      - FALL_CONFIDENCE_THRESHOLD=0.80
      # ── ROI (per-camera via admin extra.roi; global rect fallback) ─────────
      - ENABLE_ROI=true
      - ROI_TYPE=rect
      - ROI_X_MIN=0.0
      - ROI_Y_MIN=0.0
      - ROI_X_MAX=1.0
      - ROI_Y_MAX=1.0
      # ── Health / security (P0-2) ────────────────────────────────────────────
      # Fail-closed by default, same as docker-compose.yml. BEFORE deploying
      # this to a box with cameras already configured in Nx Client: set the
      # SAME value as "Service API Key" on every camera's YOLO26 plugin
      # settings first, or the plugin gets HTTP 401 and detections stop.
      # Rollback / temporary bridge while migrating field units: set
      # ALLOW_INSECURE_NO_AUTH=true in the box's .env to keep the previous
      # (unauthenticated) behavior without editing this file.
      - HEALTH_P95_DEGRADED_MS=800
      - HEALTH_AVG_DEGRADED_MS=650
      - "API_KEY_REQUIRED=${API_KEY_REQUIRED:-true}"
      - "API_KEY=${API_KEY:?Set API_KEY in .env - generate one with python tools/generate_api_key.py - and configure the matching Service API Key on every camera in Nx Client, or set ALLOW_INSECURE_NO_AUTH=true to defer}"
      - "ALLOW_INSECURE_NO_AUTH=${ALLOW_INSECURE_NO_AUTH:-false}"
      - RATE_LIMIT_SKIP_LOOPBACK=true
      - ENABLE_CLAHE=false
      - ENABLE_MULTI_SCALE=false
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
    volumes:
      - safeaging-insightface:/root/.insightface
      - /root/SafeAging/docker/wheels:/wheels:ro

volumes:
  safeaging-insightface:
