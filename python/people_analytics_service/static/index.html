<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SafeAging — Operations Console</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --txt:#e2e8f0; --muted:#94a3b8;
          --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --line:#334155; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  header .key { margin-left:auto; display:flex; gap:8px; align-items:center; }
  input, select, button, textarea { font:inherit; }
  input, select, textarea { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input[type="date"] { color-scheme:dark; min-width:10.5rem; }
  .date-field { position:relative; display:inline-block; min-width:10.5rem; vertical-align:middle; }
  .date-field input[type="date"] {
    width:100%; min-width:10.5rem; position:relative; z-index:1;
    background:var(--panel2);
  }
  .date-field input[type="date"]:not(.has-value) { color:transparent; }
  .date-field input[type="date"]:focus,
  .date-field input[type="date"].has-value { color:var(--txt); }
  .date-field input[type="date"]:not(.has-value)::-webkit-datetime-edit { opacity:0; }
  .date-field input[type="date"]::-webkit-calendar-picker-indicator { cursor:pointer; z-index:2; position:relative; }
  .date-field .date-format-hint {
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    color:var(--muted); pointer-events:none; z-index:0; letter-spacing:0.02em;
  }
  .date-field input[type="date"]:focus ~ .date-format-hint,
  .date-field input[type="date"].has-value ~ .date-format-hint { display:none; }
  button { background:var(--accent); color:#062a3a; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600; }
  button.secondary { background:var(--panel2); color:var(--txt); border:1px solid var(--line); }
  button:hover { filter:brightness(1.05); }
  nav { display:flex; gap:6px; padding:10px 20px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:transparent; color:var(--muted); border:1px solid transparent; }
  nav button.active { color:var(--txt); border-color:var(--line); background:var(--panel2); }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  .stat { background:var(--panel2); border-radius:10px; padding:14px; }
  .stat .n { font-size:26px; font-weight:700; }
  .stat .l { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:600; }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
  .tag.ok { background:rgba(34,197,94,.15); color:var(--ok); }
  .tag.warn { background:rgba(245,158,11,.15); color:var(--warn); }
  .tag.bad { background:rgba(239,68,68,.15); color:var(--bad); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); }
  .hidden { display:none; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  .field { margin-bottom:10px; }
  img.snap { max-width:160px; border-radius:8px; border:1px solid var(--line); }
  dialog { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:12px; padding:18px; width:min(420px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  #toast { position:fixed; bottom:20px; right:20px; background:var(--panel2); border:1px solid var(--line); padding:12px 16px; border-radius:10px; opacity:0; transition:.3s; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>🛡️ SafeAging</h1>
  <span class="muted">Operations console</span>
  <div class="key">
    <input id="apiKey" type="password" placeholder="X-API-Key" style="width:200px" />
    <button class="secondary" onclick="saveKey()">Save key</button>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <section id="tab-dashboard"></section>
  <section id="tab-live" class="hidden"></section>
  <section id="tab-persons" class="hidden"></section>
  <section id="tab-events" class="hidden"></section>
  <section id="tab-zones" class="hidden"></section>
</main>

<dialog id="enrollDlg">
  <h3 style="margin-top:0">Enroll person from live frame</h3>
  <input type="hidden" id="enrollCamera"><input type="hidden" id="enrollTrack">
  <p class="muted" id="enrollInfo"></p>
  <div class="field"><label>Full name</label><input id="enrollName" placeholder="John Smith"></div>
  <div class="field"><label>Gender</label>
    <select id="enrollGender"><option value="">—</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
  <div class="row" style="gap:10px">
    <div class="field" style="flex:1"><label>Date of birth</label>
      <span class="date-field"><input id="enrollDob" type="date"><span class="date-format-hint">MM/DD/YYYY</span></span></div>
    <div class="field" style="flex:1"><label>Room</label><input id="enrollRoom" placeholder="Room"></div>
  </div>
  <div class="row" style="justify-content:flex-end;margin-top:8px">
    <button class="secondary" onclick="enrollDlg.close()">Cancel</button>
    <button onclick="submitEnroll()">Enroll</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
const API = location.origin;
const ALL_TABS = [
  ["dashboard","Overview"],
  ["live","Live & Enroll"],
  ["persons","People"],
  ["events","Events"],
  ["zones","Zones"],
];
const HIDDEN_TABS = new Set(["dashboard","live","events"]);
const TABS = ALL_TABS.filter(([id]) => !HIDDEN_TABS.has(id));
let current = "persons";

function saveKey(){ localStorage.setItem("safeaging_key", document.getElementById("apiKey").value.trim()); toast("API key saved"); render(); }
function key(){ return localStorage.getItem("safeaging_key")||""; }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

function dobValue(elId){
  const v=(document.getElementById(elId).value||"").trim();
  return v || null;
}
function formatDob(iso){
  if(!iso) return "";
  const p=String(iso).slice(0,10).split("-");
  if(p.length!==3) return iso;
  return `${p[1].padStart(2,"0")}/${p[2].padStart(2,"0")}/${p[0]}`;
}
function calcAgeFromIso(iso){
  if(!iso) return "";
  const p=String(iso).slice(0,10).split("-").map(Number);
  if(p.length!==3) return "";
  const today=new Date();
  let age=today.getFullYear()-p[0];
  const m=today.getMonth()+1, day=today.getDate();
  if(m<p[1]||(m===p[1]&&day<p[2])) age--;
  return age>=0?age:"";
}
function dateFieldHtml(id){
  return `<span class="date-field"><input id="${id}" type="date"><span class="date-format-hint">MM/DD/YYYY</span></span>`;
}
function wireDateInput(input){
  if(!input || input.dataset.wired) return;
  input.dataset.wired="1";
  const sync=()=>input.classList.toggle("has-value", !!input.value);
  input.addEventListener("input", sync);
  input.addEventListener("change", sync);
  sync();
}
function wireDateInputs(root=document){
  root.querySelectorAll('input[type="date"]').forEach(wireDateInput);
}

async function api(path, opts={}){
  opts.headers = Object.assign({"X-API-Key":key()}, opts.headers||{});
  if(opts.body && typeof opts.body!=="string"){ opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(opts.body); }
  const r = await fetch(API+path, opts);
  if(!r.ok){
    let d="";
    try{ const j=await r.json(); d=j.detail||""; if(Array.isArray(d)) d=d.map(x=>x.msg||x).join("; "); }catch(e){}
    throw new Error(r.status+(d?" "+d:""));
  }
  if(r.status===204 || r.status===205) return null;
  const ct=r.headers.get("content-type")||"";
  if(!ct.includes("application/json")) return r;
  const text=await r.text();
  if(!text.trim()) return null;
  return JSON.parse(text);
}

function buildNav(){
  const nav=document.getElementById("nav");
  nav.innerHTML="";
  TABS.forEach(([id,label])=>{
    const b=document.createElement("button");
    b.textContent=label; b.className = id===current?"active":"";
    b.onclick=()=>{ current=id; render(); };
    nav.appendChild(b);
  });
}
function show(id){ TABS.forEach(([t])=>document.getElementById("tab-"+t).classList.toggle("hidden", t!==id)); }

async function render(){
  document.getElementById("apiKey").value = key();
  buildNav(); show(current);
  try {
    if(current==="dashboard") await renderDashboard();
    if(current==="live") await renderLive();
    if(current==="persons") await renderPersons();
    if(current==="events") await renderEvents();
    if(current==="zones") await renderZones();
  } catch(e){ toast("Error: "+e.message); }
}

async function renderDashboard(){
  const el=document.getElementById("tab-dashboard");
  el.innerHTML='<div class="card"><h3>Loading…</h3></div>';
  const s=await api("/admin/analytics/summary");
  el.innerHTML=`
    <div class="card"><h3>System overview</h3>
      <div class="grid">
        ${stat(s.events_24h,"Events (24h)")}${stat(s.falls_24h,"Falls (24h)")}
        ${stat(s.zone_violations_24h,"Zone violations (24h)")}${stat(s.active_persons,"Enrolled people")}
        ${stat(s.active_zones,"Active zones")}${stat(s.active_cameras,"Active cameras")}
        ${stat(s.alerts.sent,"Alerts sent")}${stat(s.alerts.failed,"Alerts failed")}
      </div></div>`;
}
function stat(n,l){ return `<div class="stat"><div class="n">${n??0}</div><div class="l">${l}</div></div>`; }

async function renderLive(){
  const el=document.getElementById("tab-live");
  const data=await api("/admin/live/tracks");
  let html='<div class="card"><h3>People on camera (live)</h3>'+
    '<p class="muted">Click <b>Enroll</b> on an Unknown track to register their face for future recognition.</p>';
  const cams=Object.keys(data.cameras||{});
  if(!cams.length) html+='<p class="muted">No cameras are sending data yet.</p>';
  cams.forEach(cam=>{
    const tracks=data.cameras[cam];
    html+=`<h4>Camera: ${cam}</h4><table><tr><th>Track</th><th>Identity</th><th>No.</th><th></th></tr>`;
    if(!tracks.length) html+='<tr><td colspan=4 class="muted">No people detected.</td></tr>';
    tracks.forEach(t=>{
      const rec=t.recognized;
      const idtxt=rec?`<span class="tag ok">${t.person_name}${t.gender?", "+t.gender:""}${t.person_age!=null?", "+t.person_age+" yrs":""}</span>`
                     :`<span class="tag warn">Unknown</span>`;
      const action = rec?'' : `<button onclick="openEnroll('${cam}',${t.track_id},${t.has_crop})">Enroll</button>`;
      html+=`<tr><td>#${t.track_id}</td><td>${idtxt}</td><td>${t.person_no??""}</td><td>${action}</td></tr>`;
    });
    html+='</table>';
  });
  html+='<div class="row" style="margin-top:10px"><button class="secondary" onclick="render()">↻ Refresh</button></div></div>';
  el.innerHTML=html;
}
function openEnroll(cam,track,hasCrop){
  document.getElementById("enrollCamera").value=cam;
  document.getElementById("enrollTrack").value=track;
  document.getElementById("enrollInfo").textContent = hasCrop
    ? `Camera ${cam}, track #${track} — will use the most recent face crop.`
    : `Camera ${cam}, track #${track} — no face crop yet; wait until the person faces the camera.`;
  document.getElementById("enrollName").value="";
  document.getElementById("enrollGender").value="";
  document.getElementById("enrollDob").value="";
  document.getElementById("enrollDob").classList.remove("has-value");
  document.getElementById("enrollRoom").value="";
  wireDateInput(document.getElementById("enrollDob"));
  document.getElementById("enrollDlg").showModal();
}
async function submitEnroll(){
  const body={ camera_id:document.getElementById("enrollCamera").value,
    track_id:parseInt(document.getElementById("enrollTrack").value),
    name:document.getElementById("enrollName").value.trim(),
    gender:document.getElementById("enrollGender").value||null,
    date_of_birth:dobValue("enrollDob"),
    room:document.getElementById("enrollRoom").value.trim()||null };
  if(!body.name){ toast("Enter full name"); return; }
  try{ const r=await api("/admin/enroll/from-track",{method:"POST",body});
    document.getElementById("enrollDlg").close();
    toast("Enrolled: "+r.person_name); render();
  }catch(e){ toast("Enroll failed: "+e.message); }
}

let _addingPerson=false;

async function renderPersons(){
  const el=document.getElementById("tab-persons");
  const ps=await api("/admin/persons?limit=500&status=active");
  let html='<div class="card"><h3>Add person (photos or video)</h3><div class="row">'+
    '<input id="pName" placeholder="Full name">'+
    '<select id="pGender"><option value="">Gender</option><option value="Male">Male</option><option value="Female">Female</option></select>'+
    dateFieldHtml("pDob")+
    '<input id="pRoom" placeholder="Room">'+
    '<input id="pFile" type="file" accept="image/*,video/*" multiple>'+
    '<button id="pSubmit" onclick="addPersonWithFace()">Create + enroll face</button></div>'+
    '<p class="muted">Photos: pick <b>5–30</b> clear face images. Video: one clip — frames sampled ~4 fps (max 30), need ≥5 frames with a face. '+
    'Pick a <b>date of birth</b> (MM/DD/YYYY) — age is calculated automatically. Face processing may take 1–3 minutes — <b>click once only</b>.</p></div>';
  html+='<div class="card"><h3>People ('+ps.length+')</h3><table><tr><th>Name</th><th>Gender</th><th>Date of birth</th><th>Age</th><th>Room</th><th>Status</th><th></th></tr>';
  ps.forEach(p=>{ const age=p.age??calcAgeFromIso(p.date_of_birth);
    html+=`<tr><td>${p.name}</td><td>${p.gender||""}</td><td>${formatDob(p.date_of_birth)}</td><td>${age??""}</td><td>${p.room||""}</td>
    <td>${p.status}</td><td><button class="secondary" onclick="delPerson('${p.id}')">Remove</button></td></tr>`; });
  html+='</table></div>';
  el.innerHTML=html;
  wireDateInputs(el);
}
async function addPersonWithFace(){
  if(_addingPerson){ toast("Processing, please wait…"); return; }
  const name=document.getElementById("pName").value.trim();
  const files=[...document.getElementById("pFile").files];
  if(!name){ toast("Enter full name"); return; }
  if(!files.length){ toast("Choose 5–30 photos or one video"); return; }
  const videos=files.filter(f=>f.type.startsWith("video/"));
  const images=files.filter(f=>f.type.startsWith("image/"));
  if(videos.length&&images.length){ toast("Use photos OR one video, not both"); return; }
  if(videos.length>1){ toast("Only one video allowed"); return; }
  if(images.length&&(images.length<5||images.length>30)){
    toast("Need 5–30 photos (selected "+images.length+")"); return; }
  const btn=document.getElementById("pSubmit");
  _addingPerson=true;
  if(btn){ btn.disabled=true; btn.textContent="Processing face…"; }
  toast("Enrolling faces (InsightFace, may take 1–3 min)…");
  try{
    const p=await api("/admin/persons",{method:"POST",body:{ name,
      gender:document.getElementById("pGender").value||null,
      date_of_birth:dobValue("pDob"),
      room:document.getElementById("pRoom").value.trim()||null,
      status:"active" }});
    let batch;
    if(videos.length){
      const b64=await fileToB64(videos[0]);
      batch=await api(`/admin/persons/${p.id}/embeddings/face-batch`,{method:"POST",
        body:{ video_b64:b64, video_sample_fps:4, source:"upload_video" }});
    }else{
      const images_b64=await Promise.all(images.map(fileToB64));
      batch=await api(`/admin/persons/${p.id}/embeddings/face-batch`,{method:"POST",
        body:{ images_b64, source:"upload_batch" }});
    }
    toast(`Added ${p.name}: ${batch.embeddings_created} face template(s) (${batch.frames_with_face}/${batch.frames_processed} frames)`);
    document.getElementById("pName").value="";
    document.getElementById("pDob").value="";
    document.getElementById("pDob").classList.remove("has-value");
    document.getElementById("pFile").value="";
    render();
  }catch(e){ toast("Error: "+e.message); }
  finally{
    _addingPerson=false;
    if(btn){ btn.disabled=false; btn.textContent="Create + enroll face"; }
  }
}
async function delPerson(id){
  if(!confirm("Permanently delete this person and all enrolled face photos? This cannot be undone."))return;
  try{ await api(`/admin/persons/${id}`,{method:"DELETE"}); toast("Deleted"); render(); }
  catch(e){ toast("Error: "+e.message); }
}
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file); }); }

async function renderEvents(){
  const el=document.getElementById("tab-events");
  const evs=await api("/admin/events?limit=50");
  let html='<div class="card"><h3>Recent events</h3><table><tr><th>Time</th><th>Type</th><th>Camera</th><th>Person</th><th>Snapshot</th></tr>';
  for(const e of evs){
    const typeTag = e.event_type==="fall"?'<span class="tag bad">Fall</span>'
      : e.event_type==="zone_violation"?'<span class="tag warn">Zone violation</span>'
      : '<span class="tag">'+e.event_type+'</span>';
    const snap = e.payload && e.payload.snapshot_key
      ? `<img class="snap" id="snap-${e.id}" alt="snapshot">` : '';
    html+=`<tr><td>${new Date(e.occurred_at).toLocaleString()}</td><td>${typeTag}</td><td>${e.camera_id}</td>
      <td>${e.person_id?'<span class="tag ok">linked</span>':'<span class="muted">—</span>'}</td><td>${snap}</td></tr>`;
  }
  html+='</table><div class="row" style="margin-top:10px"><button class="secondary" onclick="render()">↻ Refresh</button></div></div>';
  el.innerHTML=html;
  for(const e of evs){
    if(e.payload && e.payload.snapshot_key){
      loadSnap(e.id).catch(()=>{ const im=document.getElementById("snap-"+e.id); if(im) im.style.display="none"; });
    }
  }
}
async function loadSnap(id){
  const resp=await api(`/admin/events/${id}/snapshot`);
  const blob=await resp.blob();
  const im=document.getElementById("snap-"+id);
  if(im) im.src=URL.createObjectURL(blob);
}

async function renderZones(){
  const el=document.getElementById("tab-zones");
  const zs=await api("/admin/zones?active_only=false");
  let html='<div class="card"><h3>Create zone (polygon)</h3><div class="row">'+
    '<input id="zCam" placeholder="{uuid} e.g. {a3d57074-...}">'+
    '<input id="zName" placeholder="Zone name">'+
    '<select id="zType"><option value="forbidden">forbidden</option><option value="entry">entry</option><option value="exit">exit</option><option value="roi">roi</option></select>'+
    '</div><div class="field" style="margin-top:8px"><label>Polygon points (pixels)</label>'+
    '<textarea id="zPts" rows="3" placeholder="280,73,317,79,285,136,213,109" style="width:100%"></textarea></div>'+
    '<button onclick="addZone()">Create zone</button>'+
    '<p class="muted">Paste from image-map.net (<code>280,73,317,79,...</code> or full HTML) — auto-converts to '+
    '<code>[[x,y],...]</code> on paste. Coordinates are in full-frame camera pixels (640×360).</p></div>';
  html+='<div class="card"><h3>Zones</h3><table><tr><th>Camera</th><th>Name</th><th>Type</th><th>Active</th><th></th></tr>';
  zs.forEach(z=>{ html+=`<tr><td>${z.camera_id}</td><td>${z.name}</td><td>${z.zone_type}</td>
    <td>${z.active?'<span class="tag ok">on</span>':'<span class="tag bad">off</span>'}</td>
    <td><button class="secondary" onclick="delZone('${z.id}')">Remove</button></td></tr>`; });
  html+='</table></div>';
  el.innerHTML=html;
  wirePolygonInput(document.getElementById("zPts"));
}

function validatePolygonPoints(parsed){
  if(!Array.isArray(parsed) || parsed.length < 3)
    throw new Error("Need at least 3 points");
  return parsed.map(p=>{
    if(Array.isArray(p) && p.length >= 2){
      const x = Number(p[0]), y = Number(p[1]);
      if(Number.isNaN(x) || Number.isNaN(y)) throw new Error("Invalid [x,y] numbers");
      return [x, y];
    }
    throw new Error("Each point must be [x,y]");
  });
}

function parsePolygonPoints(raw){
  if(!raw || !String(raw).trim()) throw new Error("Enter polygon coordinates");
  let s = String(raw).trim();
  const coordsMatch = s.match(/coords\s*=\s*["']([^"']+)["']/i);
  if(coordsMatch) s = coordsMatch[1].trim();
  if(s.startsWith("[")) return validatePolygonPoints(JSON.parse(s));
  const nums = s.split(/[\s,;]+/).filter(Boolean).map(Number);
  if(nums.some(n=>Number.isNaN(n))) throw new Error("Invalid number in coordinates");
  if(nums.length < 6 || nums.length % 2 !== 0)
    throw new Error("Need at least 3 points (even count: x,y,x,y,...)");
  const pts = [];
  for(let i=0; i<nums.length; i+=2) pts.push([nums[i], nums[i+1]]);
  return validatePolygonPoints(pts);
}

function formatPolygonPoints(pts){
  return JSON.stringify(pts);
}

function wirePolygonInput(el){
  if(!el || el.dataset.wired) return;
  el.dataset.wired = "1";
  const normalize = ()=>{
    const raw = el.value.trim();
    if(!raw){ el.classList.remove("invalid"); return; }
    try{
      el.value = formatPolygonPoints(parsePolygonPoints(raw));
      el.classList.remove("invalid");
    }catch(e){
      el.classList.add("invalid");
    }
  };
  el.addEventListener("paste", ()=>setTimeout(normalize, 0));
  el.addEventListener("blur", normalize);
}

function normalizeCameraId(raw){
  let cid=(raw||"").trim();
  if(!cid) return cid;
  if(cid.startsWith("{") && cid.endsWith("}")) return cid;
  return "{"+cid.replace(/^\{|\}$/g,"")+"}";
}

async function addZone(){
  let pts;
  try{ pts = parsePolygonPoints(document.getElementById("zPts").value); }
  catch(e){ toast(e.message || "Invalid polygon"); return; }
  document.getElementById("zPts").value = formatPolygonPoints(pts);
  const camEl=document.getElementById("zCam");
  camEl.value=normalizeCameraId(camEl.value);
  const body={ camera_id:camEl.value.trim(),
    name:document.getElementById("zName").value.trim(),
    zone_type:document.getElementById("zType").value,
    geometry:{points:pts}, active:true };
  if(!body.camera_id||!body.name){ toast("Enter camera_id and zone name"); return; }
  try{ await api("/admin/zones",{method:"POST",body}); toast("Zone created"); render(); }catch(e){ toast(e.message); }
}
async function delZone(id){ if(!confirm("Remove this zone permanently?"))return;
  try{ await api(`/admin/zones/${id}`,{method:"DELETE"}); toast("Zone removed"); render(); }catch(e){ toast(e.message); } }

render();
wireDateInput(document.getElementById("enrollDob"));
setInterval(()=>{ if(current==="live") renderLive().catch(()=>{}); }, 4000);
</script>
</body>
