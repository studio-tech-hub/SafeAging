# Alembic configuration for SafeAging analytics service.
# Run migrations from the python/ directory:
#   cd python
#   alembic upgrade head
#
# DATABASE_URL must be set in the environment before running Alembic.
# Example:
#   export DATABASE_URL=postgresql://safeaging:safeaging@localhost:5432/safeaging
#   alembic upgrade head

[alembic]
script_location = alembic

# sqlalchemy.url is set programmatically in env.py from DATABASE_URL.
# Do NOT store credentials here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
