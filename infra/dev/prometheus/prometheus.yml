global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Analytics service — GET /metrics
  - job_name: safeaging-analytics
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - analytics:18000
