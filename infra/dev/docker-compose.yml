services:
  postgres:
    image: postgres:16
    container_name: safeaging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safeaging}
      POSTGRES_USER: ${POSTGRES_USER:-safeaging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safeaging_dev_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - safeaging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: quay.io/minio/minio:latest
    container_name: safeaging-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-safeaging}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-safeaging_minio_password}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - safeaging-minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: safeaging-minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET_SNAPSHOTS"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-safeaging}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-safeaging_minio_password}
      MINIO_BUCKET_SNAPSHOTS: ${MINIO_BUCKET_SNAPSHOTS:-safeaging-snapshots}
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: safeaging-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - safeaging-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: safeaging-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/safeaging.json
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    volumes:
      - safeaging-grafana-data:/var/lib/grafana
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  safeaging-postgres-data:
  safeaging-minio-data:
  safeaging-prometheus-data:
  safeaging-grafana-data:
