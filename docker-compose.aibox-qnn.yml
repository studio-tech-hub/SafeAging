# QCS6490 QNN overlay — Hexagon NPU (HTP) or Adreno GPU via onnxruntime-qnn plugin.
#
# Mount pre-downloaded wheels under /root/wheels/ on the AI Box:
#   onnxruntime-1.24.4-cp311-cp311-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
#   onnxruntime_qnn-2.2.0-cp311-cp311-manylinux_2_34_aarch64.whl
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.aibox-hostdb.yml \
#     -f docker-compose.aibox-qnn.yml up -d --build

services:
  analytics:
    devices:
      - /dev/adsprpc-smd:/dev/adsprpc-smd
      - /dev/ion:/dev/ion
      - /dev/kgsl-3d0:/dev/kgsl-3d0
    environment:
      - YOLO_BACKEND=${YOLO_BACKEND:-cpu}
      - QNN_BACKEND_PATH=${QNN_BACKEND_PATH:-}
      - QNN_HTP_PERFORMANCE_MODE=${QNN_HTP_PERFORMANCE_MODE:-burst}
      - QNN_HTP_FP16=${QNN_HTP_FP16:-true}
      - MODEL_PATH=${MODEL_PATH:-/app/models/yolo26n.onnx}
    volumes:
      - /usr/lib/rfsa/adsp:/usr/lib/rfsa/adsp:ro
      - /root/wheels:/wheels:ro
